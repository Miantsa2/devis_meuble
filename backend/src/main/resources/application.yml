spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/devis_meuble}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: none   # le schéma est géré par Flyway (db/migration)
    open-in-view: false
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
app:
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}
  admin:
    username: ${APP_ADMIN_USERNAME:}
    password: ${APP_ADMIN_PASSWORD:}
    reset: ${APP_ADMIN_RESET:false}
